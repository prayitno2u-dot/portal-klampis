<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e6fe0">
<title>Portal Puskesmas Klampis Ngasem</title>
<style>
  html,body{margin:0;height:100%;background:#0a3f95;font-family:system-ui,Segoe UI,Roboto,sans-serif}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
  #muat{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
        color:#fff;background:linear-gradient(160deg,#0a3f95,#2577e6);z-index:0;text-align:center;padding:24px}
  #muat b{font-size:20px;letter-spacing:.5px}
  #muat a{margin-top:18px;color:#0a3f95;background:#fff;padding:10px 18px;border-radius:10px;text-decoration:none;font-weight:600}
</style>
</head>
<body>
<div id="muat">
  <b>Portal Puskesmas Klampis Ngasem</b>
  <p>Memuat portal…</p>
  <a id="langsung" href="#">Buka langsung bila tak muncul</a>
</div>
<script>
  // Alamat aplikasi Apps Script (ganti di sini bila deployment baru)
  var APP = "https://script.google.com/macros/s/AKfycbzAyt4XcX5WgKpkTJy58du22WK9hMRN_QjYExkblsRI0eN_9xySP5UxWAevMgiEmWDp/exec";
  document.getElementById('langsung').href = APP;
  // ?mode=langsung -> pindah halaman penuh (tanpa bingkai)
  if (/[?&]mode=langsung/.test(location.search)) { location.replace(APP); }
  else {
    var f = document.createElement('iframe');
    f.src = APP; f.title = 'Portal Puskesmas Klampis Ngasem';
    f.allow = 'clipboard-write; fullscreen';
    document.body.appendChild(f);
  }
</script>
<noscript><p style="color:#fff;padding:24px">Aktifkan JavaScript, atau buka <a style="color:#fff" href="https://script.google.com/macros/s/AKfycbzAyt4XcX5WgKpkTJy58du22WK9hMRN_QjYExkblsRI0eN_9xySP5UxWAevMgiEmWDp/exec">portal langsung</a>.</p></noscript>
</body>
</html>
